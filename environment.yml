name: chimann
channels: [conda-forge, bioconda]
dependencies:
  - python>=3.10     # ChimAnn adapters and local runtime installer
  - eviann           # annotation binaries/dependencies, including SNAP
  - transdecoder
  - gffcompare
  - gffread
# Install the unmodified upstream eviann checkout into eviann/bin with install_eviann.py.
# CNN-Mamba runs separately with cnn_python in an existing CUDA/Mamba environment.
